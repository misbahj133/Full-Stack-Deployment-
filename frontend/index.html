<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Fieldnotes — A Journal for Dispatches Worth Reading</title>
    <meta
      name="description"
      content="Fieldnotes is a blog platform for writing and reading short-form dispatches — essays, notes, and stories, published simply and read distraction-free."
    />
    <link rel="canonical" href="https://your-deployed-domain.example" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fieldnotes — A Journal for Dispatches Worth Reading" />
    <meta
      property="og:description"
      content="Read and publish short-form dispatches — essays, notes, and stories."
    />
    <meta property="og:url" content="https://your-deployed-domain.example" />
    <meta property="og:image" content="https://your-deployed-domain.example/og-cover.png" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fieldnotes — A Journal for Dispatches Worth Reading" />
    <meta
      name="twitter:description"
      content="Read and publish short-form dispatches — essays, notes, and stories."
    />

    <meta name="theme-color" content="#1F5C4F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect speeds up the first font request - Lighthouse "preconnect to required origins" -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
